[package]
name = "korri-n2k"
version = "0.3.1"
 edition = "2021"
description = "no_std-first NMEA 2000 protocol stack for embedded and Linux systems"
repository = "https://github.com/fard-draf/korri-n2k"
readme = "README.md"
license = "MIT"
keywords = ["n2k", "nmea2000", "can", "embedded", "no-std"]
categories = ["embedded", "no-std", "network-programming"]

[features]
default = ["embassy"]
embassy = ["dep:embassy-time", "dep:embassy-sync"]
tokio = ["std", "dep:tokio"]
std = []
defmt = ["dep:defmt"]
build-download = ["dep:ureq"]

[dependencies]
embassy-time = { version = "0.4", optional = true }
embassy-sync = { version = "0.6", optional = true }
tokio = { version = "1.47.1", optional = true, default-features = false, features = ["sync", "time", "macros"] }
embedded-can = "0.4"
thiserror-no-std = "2.0"
futures-util = { version = "0.3", default-features = false }

defmt = { version = "0.3", optional = true }

[dev-dependencies]
critical-section = { version = "1.1", features = ["std"] }
static_cell = "2.1.1"
tokio = { version = "1.47.1", features = ["full"] }
embassy-executor = { version = "0.7.0", features = ["executor-thread"] }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
ureq = { version = "2.11", optional = true }

# ============================================================================
# Examples 
# ============================================================================

[[example]]
name = "quickstart"
path = "examples/std/quickstart.rs"

[[example]]
name = "lookup_enum_usage"
path = "examples/std/lookup_enum_usage.rs"

[[example]]
name = "iso_name_usage"
path = "examples/std/iso_name_usage.rs"
