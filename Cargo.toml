[package]
name = "korri-n2k"
version = "0.6.0"
edition = "2021"
rust-version = "1.96"
description = "no_std-first NMEA 2000 protocol stack for embedded and Linux systems"
repository = "https://github.com/fard-draf/korri-n2k"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["n2k", "nmea2000", "can", "embedded", "no-std"]
categories = ["embedded", "no-std", "network-programming"]
exclude = ["tests/", ".github/", "archives/"]

[features]
default = []
embassy = ["dep:embassy-sync"]
tokio = ["std", "dep:tokio"]
std = []
defmt = ["dep:defmt"]
build-download = ["dep:ureq"]
full-pgns = []

[dependencies]
embassy-sync = { version = "0.6", optional = true }
tokio = { version = "1.47.1", optional = true, default-features = false, features = ["sync", "time"] }
thiserror-no-std = "2.0"
futures-util = { version = "0.3", default-features = false }

defmt = { version = "0.3", optional = true }

[dev-dependencies]
critical-section = { version = "1.1", features = ["std"] }
static_cell = "2.1.1"
tokio = { version = "1.53", features = ["full", "test-util"] }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
ureq = { version = "2.11", optional = true }

# ============================================================================
# Examples 
# ============================================================================

[[example]]
name = "quickstart"
path = "examples/std/quickstart.rs"

[[example]]
name = "lookup_enum_usage"
path = "examples/std/lookup_enum_usage.rs"

[[example]]
name = "iso_name_usage"
path = "examples/std/iso_name_usage.rs"
