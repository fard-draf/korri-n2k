name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Unit Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
      # `default = []`, so this compiles no runner at all: it is the I/O-free
      # engine and the codec on their own, which is now a first-class API.
      - name: Run tests (no runtime)
        run: cargo test --verbose --no-default-features
      - name: Run tests (tokio)
        run: cargo test --verbose --features tokio
      - name: Run tests (embassy)
        run: cargo test --verbose --features embassy
      - name: Build and run the examples
        run: |
          cargo run --example quickstart
          cargo run --example lookup_enum_usage
          cargo run --example iso_name_usage
          cargo run --example fast_packet_rx --features std
          cargo run --example blocking_claim --features std
          cargo run --example address_claim --features tokio

  check-embedded-cortex-m4:
    name: Check (no_std / cortex-m4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: thumbv7em-none-eabihf
      - name: Check compilation for stm32
        run: cargo check --target thumbv7em-none-eabihf --verbose
      # The bare-metal runner only exists under `embassy`, so the job above
      # never compiles it.
      - name: Check the embassy runner for stm32
        run: cargo check --lib --target thumbv7em-none-eabihf --features embassy --verbose

  check-embedded-esp32c3:
    name: Check (no_std / esp32c3 / RISC-V)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: riscv32imc-unknown-none-elf
      - name: Check library compilation
        run: cargo check --lib --target riscv32imc-unknown-none-elf --verbose
      - name: Check the embassy runner for esp32c3
        run: cargo check --lib --target riscv32imc-unknown-none-elf --features embassy --verbose

  # check-embedded-esp32s3:
  #   name: Check (no_std / esp32s3 / Xtensa)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Install esp rust toolchain
  #       uses: esp-rs/xtensa-toolchain@v1.5
  #       with:
  #         default: true
  #         buildtargets: esp32s3

  #     - name: Check library compilation
  #       env:
  #         RUSTUP_TOOLCHAIN: esp
  #       run: cargo +esp check --lib --target xtensa-esp32s3-none-elf --verbose

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy (Linter)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (tokio)
        run: cargo clippy --no-default-features --features tokio --all-targets -- -D warnings
      - name: Clippy (embassy)
        run: cargo clippy --no-default-features --features embassy --all-targets -- -D warnings
