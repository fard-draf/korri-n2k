name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Unit Tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
      - name: Install just
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: just
      - name: Run ci-test
        run: just ci-test

  check-embedded-cortex-m4:
    name: Check (no_std / cortex-m4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: thumbv7em-none-eabihf
      - name: Install just
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: just
      - name: Run ci-cortex-m4
        run: just ci-cortex-m4

  check-embedded-esp32c3:
    name: Check (no_std / esp32c3 / RISC-V)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: riscv32imc-unknown-none-elf
      - name: Install just
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: just
      - name: Run ci-esp32c3
        run: just ci-esp32c3

  # check-embedded-esp32s3:
  #   name: Check (no_std / esp32s3 / Xtensa)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Install esp rust toolchain
  #       uses: esp-rs/xtensa-toolchain@v1.5
  #       with:
  #         default: true
  #         buildtargets: esp32s3

  #     - name: Check library compilation
  #       env:
  #         RUSTUP_TOOLCHAIN: esp
  #       run: cargo +esp check --lib --target xtensa-esp32s3-none-elf --verbose

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - name: Install just
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: just
      - name: Run ci-lint
        run: just ci-lint
